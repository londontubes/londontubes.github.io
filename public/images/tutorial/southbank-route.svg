    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="34" fill="url(#bg-southbank)" />
  <path d="M0 230 C200 200 400 240 800 190 L800 360 L0 360 Z" fill="#042a3f" opacity="0.9" />
  <rect x="0" y="260" width="800" height="50" fill="#051524" />
