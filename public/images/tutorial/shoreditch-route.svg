<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title-shoreditch-wall desc-shoreditch-wall">
  <title id="title-shoreditch-wall">Shoreditch mural wall</title>
  <desc id="desc-shoreditch-wall">An expressive wall of street art, neon, and grime for Shoreditch.</desc>
  <defs>
    <linearGradient id="bg-shoreditch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="34" fill="url(#bg-shoreditch)" />
  <rect x="60" y="120" width="680" height="200" fill="#0f172a" stroke="#c026d3" stroke-width="6" rx="18" />
  <rect x="90" y="150" width="120" height="120" fill="#f43f5e" />
  <rect x="240" y="150" width="100" height="120" fill="#fbbf24" />
  <rect x="360" y="150" width="140" height="120" fill="#38bdf8" />
  <rect x="520" y="150" width="120" height="120" fill="#a5b4fc" />
  <path d="M90 190 L210 190 L180 230" fill="#0f172a" />
  <path d="M390 190 C420 160 460 160 490 190" stroke="#0a0a0a" stroke-width="6" fill="none" />
  <circle cx="600" cy="210" r="16" fill="#f472b6" />
  <circle cx="640" cy="210" r="8" fill="#fde68a" />
  <line x1="120" y1="260" x2="700" y2="260" stroke="#fff" stroke-width="4" stroke-dasharray="12 8" opacity="0.5" />
  <text x="50" y="50" fill="#fee2e2" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600">Shoreditch energy</text>
  <text x="50" y="80" fill="#fcd34d" font-family="Inter, system-ui, sans-serif" font-size="16">Street art · Coffee shops · Nightlife</text>
</svg>
